schemaVersion: 2
name: "83-if-inside-loop"
description: |
  Tests if condition combined with repeat_while, where conditional steps
  execute inside a loop body.

fixture:
  host_window:
    type: CodingRiver.UPilot.Flow.SampleLoginWindow
    reopen_if_open: true

steps:
  - name: Click save to show toast
    action: click
    selector: "#save-button"

  - name: Toast becomes visible
    action: assert_visible
    selector: "#toast-message"
    timeout: "5s"

  - name: Loop with conditional steps
    repeat_while:
      condition:
        exists: "#toast-message"
      max_iterations: 3
      steps:
        - name: Assert toast while visible
          action: assert_visible
          selector: "#toast-message"
          if:
            exists: "#toast-message"

        - name: Wait for toast timer to expire
          action: wait
          duration: "1500ms"

  - name: Toast hidden after loop
    action: assert_not_visible
    selector: "#toast-message"
    timeout: "2s"
