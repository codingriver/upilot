schemaVersion: 2
name: "84-loop-multi-step"
description: |
  Tests repeat_while with multiple steps per iteration and condition-driven exit.

fixture:
  host_window:
    type: CodingRiver.UPilot.Flow.SampleLoginWindow
    reopen_if_open: true

steps:
  - name: Click save to show toast
    action: click
    selector: "#save-button"

  - name: Toast becomes visible
    action: assert_visible
    selector: "#toast-message"
    timeout: "5s"

  - name: Multi-step loop until toast hides
    repeat_while:
      condition:
        exists: "#toast-message"
      max_iterations: 3
      steps:
        - name: Assert toast visible
          action: assert_visible
          selector: "#toast-message"

        - name: Assert save button remains visible
          action: assert_visible
          selector: "#save-button"

        - name: Short wait
          action: wait
          duration: "1500ms"

  - name: Toast hidden after loop
    action: assert_not_visible
    selector: "#toast-message"
    timeout: "2s"
