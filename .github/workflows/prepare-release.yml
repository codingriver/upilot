name: 发布版本

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.3.12 or v0.3.12"
        required: true
        type: string
      acceptanceRunId:
        description: "Optional successful UPilot Unity Release Evidence workflow run ID"
        required: false
        default: ""
        type: string

concurrency:
  group: prepare-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, node24
        with:
          python-version: "3.11"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          raw="${{ github.event.inputs.version }}"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must use MAJOR.MINOR.PATCH format. Current version: $raw" >&2
            exit 1
          fi
          tag="v$version"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists. Delete/recreate it intentionally or choose a new version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install locked contract dependencies
        run: |
          python -m pip install uv
          uv sync --directory upilotserver~ --frozen --extra dev

      - name: Validate release source and optional Unity evidence
        env:
          GH_TOKEN: ${{ github.token }}
          UPILOT_ACCEPTANCE_RUN_ID: ${{ inputs.acceptanceRunId }}
        shell: bash
        run: |
          args=()
          if [[ -n "$UPILOT_ACCEPTANCE_RUN_ID" ]]; then
            args+=(--require-unity-summary)
          fi
          uv run --directory upilotserver~ --frozen --extra dev python scripts/check_release_quality.py "${args[@]}"

      - name: Preserve source-bound quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: upilot-pre-release-quality-${{ github.sha }}
          path: artifacts/reliability-quality/

      - name: Synchronize version files
        run: python upilotserver~/deploy/sync_release_version.py "${{ steps.release.outputs.version }}"

      - name: Validate version files
        run: python upilotserver~/deploy/sync_release_version.py "${{ steps.release.outputs.version }}" --check

      - name: Commit release version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json upilotserver~/pyproject.toml
          if git diff --cached --quiet; then
            echo "Version files already match ${{ steps.release.outputs.version }}."
          else
            git commit -m "release: prepare ${{ steps.release.outputs.tag }}"
          fi

      - name: Push release commit and tag
        env:
          UPILOT_ACCEPTANCE_RUN_ID: ${{ inputs.acceptanceRunId }}
        shell: bash
        run: |
          tag_message="Release ${{ steps.release.outputs.tag }}"
          if [[ -n "$UPILOT_ACCEPTANCE_RUN_ID" ]]; then
            tag_message+=$'\nUPilot-Acceptance-Run: '"$UPILOT_ACCEPTANCE_RUN_ID"
          fi
          git tag -a "${{ steps.release.outputs.tag }}" -m "$tag_message"
          git push origin HEAD:main
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Dispatch tag build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run build-server-exe.yml \
            --ref "${{ steps.release.outputs.tag }}" \
            -f version="${{ steps.release.outputs.version }}"
