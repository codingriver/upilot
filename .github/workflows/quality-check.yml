name: UPilot Contract Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked contract dependencies
        run: |
          python -m pip install uv
          uv sync --directory upilotserver~ --frozen --extra dev
      - name: Check contracts and Skill pack
        run: uv run --directory upilotserver~ --frozen --extra dev python scripts/check_release_quality.py
      - name: Preserve source-bound quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upilot-quality-${{ github.sha }}
          path: artifacts/reliability-quality/
