name: Build UPilot MCP Server EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override server version"
        required: false
        type: string

concurrency:
  group: build-server-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-win-x64:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, node24
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            upilotserver~/requirements.txt
            upilotserver~/pyproject.toml

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $inputVersion = '${{ github.event.inputs.version }}'.TrimStart('v')
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          if ($isTag) {
            $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
            if ($inputVersion -and $inputVersion -ne $tagVersion) {
              Write-Error "Workflow input version ($inputVersion) must match tag version ($tagVersion)."
              exit 1
            }
            $version = $tagVersion
          } elseif ($inputVersion) {
            $version = $inputVersion
          } else {
            $version = $packageVersion
          }
          $version = $version.TrimStart('v')
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$') {
            Write-Error "Release version must use MAJOR.MINOR.PATCH format. Current version: $version"
            exit 1
          }
          $channel = 'release'
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "server_version=$version" >> $env:GITHUB_OUTPUT
          "upm_version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Validate tag source versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$') {
            Write-Error "Release tags must use vMAJOR.MINOR.PATCH format. Current tag: ${{ github.ref_name }}"
            exit 1
          }
          $tagVersion = $tag.TrimStart('v')
          python upilotserver~/deploy/sync_release_version.py $tagVersion --check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag $tag points to source files with mismatched versions. Use the 发布版本 workflow so CI commits package.json and upilotserver~/pyproject.toml before tagging."
            exit $LASTEXITCODE
          }
          Write-Host "Release versions validated: tag/package/server = $tagVersion"

      - name: Synchronize artifact versions
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          python upilotserver~/deploy/sync_release_version.py "${{ steps.version.outputs.server_version }}"

      - name: Validate resolved release versions
        shell: pwsh
        run: |
          python upilotserver~/deploy/sync_release_version.py "${{ steps.version.outputs.server_version }}" --check

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install uv
          uv export --directory upilotserver~ --frozen --extra dev --no-emit-project --output-file requirements-locked.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r upilotserver~/requirements-locked.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller

      - name: Gate packaged source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            python upilotserver~/scripts/check_release_quality.py --release-tag '${{ github.ref_name }}'
          } else {
            python upilotserver~/scripts/check_release_quality.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve source-bound quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: upilot-build-quality-${{ github.sha }}
          path: artifacts/reliability-quality/

      - name: Build standalone exe
        shell: pwsh
        run: |
          $baseUrl = ""
          if ('${{ github.ref_type }}' -eq 'tag') {
            $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          }
          python upilotserver~/deploy/build_server_exe.py `
            --version "${{ steps.version.outputs.server_version }}" `
            --upm-version "${{ steps.version.outputs.upm_version }}" `
            --channel "${{ steps.version.outputs.channel }}" `
            --commit "${{ github.sha }}" `
            --base-url "$baseUrl"

      - name: Verify exe version
        shell: pwsh
        run: |
          $exe = Get-ChildItem upilotserver~/dist/upilot-mcp-server-*-win-x64.exe | Select-Object -First 1
          & $exe.FullName --version

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: upilot-mcp-server-win-x64
          path: |
            upilotserver~/dist/upilot-mcp-server-*-win-x64.exe
            upilotserver~/dist/upilot-mcp-server-*-win-x64.exe.sha256
            upilotserver~/dist/manifest.json

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3, node24
        with:
          make_latest: true
          overwrite_files: true
          files: |
            upilotserver~/dist/upilot-mcp-server-*-win-x64.exe
            upilotserver~/dist/upilot-mcp-server-*-win-x64.exe.sha256
            upilotserver~/dist/manifest.json
