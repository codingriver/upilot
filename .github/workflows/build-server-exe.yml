name: Build UPilot MCP Server EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override server version"
        required: false
        type: string

jobs:
  build-win-x64:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $script = @'
          import pathlib
          for raw in pathlib.Path('upilotserver~/pyproject.toml').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line.startswith('version') and '=' in line:
                  print(line.split('=', 1)[1].strip().strip('"').strip("'"))
                  raise SystemExit
          print('0.0.0')
          '@
          $pyVersion = $script | python -
          if ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = $pyVersion
          }
          $channel = 'release'
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "py_version=$pyVersion" >> $env:GITHUB_OUTPUT
          "server_version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Validate release versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $packageVersion = '${{ steps.version.outputs.package_version }}'
          $pyVersion = '${{ steps.version.outputs.py_version }}'
          $serverVersion = '${{ steps.version.outputs.server_version }}'
          $errors = @()

          if ('${{ github.ref_name }}' -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$') {
            $errors += "Release tags must use vMAJOR.MINOR.PATCH format. Current tag: ${{ github.ref_name }}"
          }
          if ($packageVersion -ne $tagVersion) {
            $errors += "package.json version ($packageVersion) must match tag version ($tagVersion)."
          }
          if ($pyVersion -ne $tagVersion) {
            $errors += "upilotserver~/pyproject.toml version ($pyVersion) must match tag version ($tagVersion)."
          }
          if ($serverVersion -ne $tagVersion) {
            $errors += "Resolved server version ($serverVersion) must match tag version ($tagVersion)."
          }

          if ($errors.Count -gt 0) {
            Write-Error ("Release version validation failed:" + [Environment]::NewLine + ($errors -join [Environment]::NewLine))
            exit 1
          }

          Write-Host "Release versions validated: tag/package/server = $tagVersion"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r upilotserver~/requirements.txt
          python -m pip install "mcp[cli]>=1.26.0,<2" pyinstaller

      - name: Build standalone exe
        shell: pwsh
        run: |
          $baseUrl = ""
          if ('${{ github.ref_type }}' -eq 'tag') {
            $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          }
          python upilotserver~/deploy/build_server_exe.py `
            --version "${{ steps.version.outputs.server_version }}" `
            --channel "${{ steps.version.outputs.channel }}" `
            --commit "${{ github.sha }}" `
            --base-url "$baseUrl"

      - name: Verify exe version
        shell: pwsh
        run: |
          $exe = Get-ChildItem upilotserver~/dist/upilot-mcp-server-*-win-x64.exe | Select-Object -First 1
          & $exe.FullName --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upilot-mcp-server-win-x64
          path: |
            upilotserver~/dist/upilot-mcp-server-*-win-x64.exe
            upilotserver~/dist/upilot-mcp-server-*-win-x64.exe.sha256
            upilotserver~/dist/manifest.json

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          overwrite_files: true
          files: |
            upilotserver~/dist/upilot-mcp-server-*-win-x64.exe
            upilotserver~/dist/upilot-mcp-server-*-win-x64.exe.sha256
            upilotserver~/dist/manifest.json
